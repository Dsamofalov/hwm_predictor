name: Probe Mighty Slam and Power Strike corpus

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe_slam_powerstrike.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Probe both abilities
        env:
          PYTHONPATH: python
        run: |
          python scripts/ability_probe.py hwm_battles mightyslam --rows 1000 --out data/reports/mightyslam_probe.json
          python scripts/ability_probe.py hwm_battles powerstrike --rows 1000 --out data/reports/powerstrike_probe.json
      - name: Commit evidence and changelog
        run: |
          rm .github/workflows/probe_slam_powerstrike.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data: capture slam and power-strike probes'
          REPORT_SHA=$(git rev-parse HEAD)
          export REPORT_SHA STAGING_SHA="$GITHUB_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path('data/reports/mightyslam_probe.json').read_text(encoding='utf-8'))
          p=json.loads(Path('data/reports/powerstrike_probe.json').read_text(encoding='utf-8'))
          log=Path('changelog.md'); text=log.read_text(encoding='utf-8').rstrip()+'\n\n'
          text += f'''### Mighty Slam / Power Strike corpus probes\n\n- Commit: `{os.environ['STAGING_SHA']}`\n  - Staged self-removing full-corpus probes for two high-impact movement/control abilities.\n- Commit: `{os.environ['REPORT_SHA']}`\n  - Stored `data/reports/mightyslam_probe.json` and `data/reports/powerstrike_probe.json`.\n  - Mighty Slam: **{m['matched_decisions']}** decisions / **{m['battles']}** battles; specials `{m['special_codes']}`; position deltas `{m['target_deltas']['position']}`.\n  - Power Strike: **{p['matched_decisions']}** decisions / **{p['battles']}** battles; specials `{p['special_codes']}`; position deltas `{p['target_deltas']['position']}`.\n  - Parse errors: Mighty Slam **{len(m['errors'])}**, Power Strike **{len(p['errors'])}**.\n'''
          log.write_text(text,encoding='utf-8')
          PY
          git add changelog.md
          git commit -m 'docs: log slam and power-strike probes'
          git push origin HEAD:main
