name: Validate Paw Strike HP-distance formula

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate_pawstrike_formula.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate historical formula on chronological holdout
        env:
          PYTHONPATH: python
        run: |
          python - <<'PY'
          import json, math
          from collections import Counter, defaultdict
          from pathlib import Path
          from hwm_solver.protocol.replay import parse_initial_entities, parse_turns, iter_compact_decisions, parse_commands, _perspective_owner, _player_won

          root=Path('hwm_battles/battles')
          battles=sorted((p for p in root.iterdir() if p.is_dir()),key=lambda p:int(p.name));cut=int(len(battles)*0.8)
          def hp(e):
              n=max(0,int(e.get('count',0))); mh=max(1,int(e.get('max_hp',1))); top=max(0,int(e.get('top_hp',mh)))
              return 0 if n<=0 else (n-1)*mh+top
          def pbase(a,t):
              ah=max(1,hp(a));th=max(1,hp(t))
              p=0.25+0.03*(ah/th) if ah>th else 0.25-0.03*(th/ah)
              return min(0.75,max(0.05,p))
          def ptotal(a,t,tiles):
              if tiles<=0:return 0.0
              p=pbase(a,t);return 1-(1-p)**tiles
          def collect(dirs):
              out=[]
              for d in dirs:
                  init=(d/'init.txt').read_text(errors='replace');turns=(d/'turns0.txt').read_text(errors='replace')
                  es,_=parse_initial_entities(init);owner=_perspective_owner(es);won=_player_won(init,es,owner)
                  for r in iter_compact_decisions(d.name,es,parse_turns(turns),owner,player_won=won):
                      before={int(e['uid']):e for e in r['state_before']};actor=before.get(int(r['actor_uid']));target=before.get(int(r['target_uid'])) if r.get('target_uid') is not None else None
                      if not actor or not target or 'pawstrike' not in set(actor.get('abilities') or []) or r['action_type']!='MELEE_ATTACK':continue
                      cmds=parse_commands(r['raw']);dam=[c for c in cmds if c.opcode=='DAMAGE' and c.actor_uid==int(r['actor_uid']) and c.target_uid is not None]
                      if not dam:continue
                      tuid=int(dam[0].target_uid);target=before.get(tuid)
                      if not target:continue
                      move=next((c for c in cmds if c.opcode=='MOVE' and c.actor_uid==int(r['actor_uid'])),None)
                      dx=r.get('first_move_x');dy=r.get('first_move_y')
                      if dx is None or dy is None:dx=move.x if move else actor.get('x');dy=move.y if move else actor.get('y')
                      tiles=max(abs(int(dx)-int(actor.get('x',dx))),abs(int(dy)-int(actor.get('y',dy))))
                      forced=any(c.opcode=='FORCED_POSITION' and int(c.actor_uid or -1)==tuid for c in cmds)
                      irec=next((c for c in cmds if c.opcode=='I_RECORD' and int(c.actor_uid or -1)==tuid),None)
                      proc=bool(forced and irec)
                      source_tail=int(irec.raw[4:8]) if irec and irec.raw[4:8].isdigit() else None
                      heroes=[e for e in before.values() if e.get('is_hero') and int(e.get('owner',-1))==int(actor.get('owner',-2))]
                      out.append({'battle':d.name,'tiles':tiles,'proc':proc,'p_base':pbase(actor,target),'p_total':ptotal(actor,target,tiles),
                                  'actor_hp':hp(actor),'target_hp':hp(target),'actor_owner':int(actor.get('owner',-1)),
                                  'hero_present':bool(heroes),'hero_abilities':sorted(set(heroes[0].get('abilities') or [])) if heroes else [],
                                  'target_big':'big' in set(target.get('abilities') or []),'i_source':source_tail,'actor_uid':int(r['actor_uid'])})
              return out
          train=collect(battles[:cut]);test=collect(battles[cut:])
          def brier(rows,key_or_fn):
              fn=key_or_fn if callable(key_or_fn) else lambda r:r[key_or_fn]
              return sum((fn(r)-int(r['proc']))**2 for r in rows)/len(rows)
          base=sum(int(r['proc']) for r in train)/len(train)
          train_formula=brier(train,'p_total');test_formula=brier(test,'p_total');test_base=brier(test,lambda r:base)
          fixed10=brier(test,lambda r:min(1.0,.1*r['tiles']))
          # Calibration buckets by predicted probability decile.
          buckets=defaultdict(lambda:[0,0,0.0])
          for r in test:
              k=min(9,int(r['p_total']*10));buckets[k][0]+=1;buckets[k][1]+=int(r['proc']);buckets[k][2]+=r['p_total']
          cal=[{'bucket':k,'n':v[0],'hits':v[1],'observed':v[1]/v[0],'predicted':v[2]/v[0]} for k,v in sorted(buckets.items())]
          source_match=sum(r['proc'] and r['i_source']==r['actor_uid'] for r in train+test)
          proc_n=sum(int(r['proc']) for r in train+test)
          owners=Counter(str(r['actor_owner']) for r in train+test)
          hero=Counter('hero' if r['hero_present'] else 'no_hero' for r in train+test)
          payload={'train_n':len(train),'train_hits':sum(int(r['proc']) for r in train),'heldout_n':len(test),'heldout_hits':sum(int(r['proc']) for r in test),
                   'brier':{'train_formula':train_formula,'heldout_formula':test_formula,'heldout_train_frequency':test_base,'heldout_linear_0.10':fixed10},
                   'heldout_calibration':cal,'i_record_source_matches_actor':source_match,'proc_n':proc_n,
                   'actor_owners':dict(owners),'hero_presence':dict(hero),
                   'formula_gate':bool(test_formula+0.01<test_base and test_formula<=fixed10+0.01 and source_match==proc_n),
                   'rows':test}
          Path('data/reports/pawstrike_formula_validation.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in payload.items() if k!='rows'},ensure_ascii=False,indent=2))
          PY
      - name: Commit report and changelog
        run: |
          rm .github/workflows/validate_pawstrike_formula.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data: validate Paw Strike HP-distance formula'
          REPORT_SHA=$(git rev-parse HEAD)
          export REPORT_SHA STAGING_SHA="$GITHUB_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('data/reports/pawstrike_formula_validation.json').read_text(encoding='utf-8'))
          p=Path('changelog.md');text=p.read_text(encoding='utf-8').rstrip()+'\n\n'
          text += f'''### Paw Strike HP-distance formula validation\n\n- Commit: `{os.environ['STAGING_SHA']}`\n  - Staged a self-removing chronological validation of the historical HeroesWM base-HP formula combined with per-travelled-cell repeated proc attempts.\n- Commit: `{os.environ['REPORT_SHA']}`\n  - Stored `data/reports/pawstrike_formula_validation.json`.\n  - Held-out Brier: HP-distance formula **{r['brier']['heldout_formula']:.5f}**, train-frequency baseline **{r['brier']['heldout_train_frequency']:.5f}**, linear 10%/cell **{r['brier']['heldout_linear_0.10']:.5f}**.\n  - `I_RECORD` source matches Paw Strike actor in **{r['i_record_source_matches_actor']}/{r['proc_n']}** observed procs.\n  - Actor owners `{r['actor_owners']}`; same-owner hero presence `{r['hero_presence']}`.\n  - Formula gate: **{r['formula_gate']}**.\n'''
          p.write_text(text,encoding='utf-8')
          PY
          git add changelog.md
          git commit -m 'docs: log Paw Strike formula validation'
          git push origin HEAD:main
