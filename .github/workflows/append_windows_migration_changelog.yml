name: Record Windows validation bookkeeping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append_windows_migration_changelog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: [self-hosted, windows, x64, hwm-windows]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Record exhaustive Windows validation and M11 reproducibility
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'

          function Append-IfMissing([string]$Path, [string]$Marker, [string[]]$Lines) {
            $existing = Get-Content -Raw -Encoding UTF8 $Path
            if ($existing.Contains($Marker)) {
              Write-Host "$Path already contains $Marker"
              return
            }
            $entry = ([Environment]::NewLine + ($Lines -join [Environment]::NewLine) + [Environment]::NewLine)
            Add-Content -Path $Path -Value $entry -Encoding UTF8
          }

          Append-IfMissing 'changelog.md' '### Exhaustive Windows main-front validation and M11 uncertainty reproducibility' @(
            '### Exhaustive Windows main-front validation and M11 uncertainty reproducibility'
            ''
            '- Commit: `8dc9dc5b81db936089c7764fafb9c22cb79505a3`'
            '  - Stabilized M11 uncertainty calibration with deterministic summation/member moments, sorted UID aggregation, and an explicit `1e-12` numerical-tie threshold so mathematically equal learned/generic windows are not classified by floating-point noise.'
            '  - Added regressions for identical-member zero disagreement and sub-epsilon learned/generic ties; refreshed the compact uncertainty evidence from the final committed evaluator.'
            '  - Dedicated Windows self-hosted run `31419316512`: 7/7 targeted tests PASS; two independent full-corpus uncertainty processes produced exactly identical JSON.'
            '  - Production uncertainty fallback remains disabled: disagreement tracks absolute error but still does not identify learned-vs-generic underperformance reliably at every horizon.'
            '- Commit: `bb8404606621966d8c688f22e93c6ce35dd695ea`'
            '  - Kept permanent main-front CTest focused on `hwm-planner-tests` by excluding the independently owned `hwm-tests` executable; ability validation remains responsible for that executable and its MSVC failures.'
            '- Exhaustive main-front validation run `31417309122` (temporary PR #5 harness): Debug MSVC build and `hwm-planner-tests` PASS; 120/120 held-out planner states valid with 0 invalid recommendations; all four daemon integrations PASS; Python 61/61 PASS; TypeScript/extension PASS; Release MSVC/CTest and `planner-demo 5000` PASS; all four M11 full-corpus evaluator commands PASS.'
            '  - The ability-owned monolithic `hwm-tests` executable is intentionally excluded from the main-front PASS claim after exposing three independent ability-lane defects on MSVC: Mighty Slam test pointer invalidation after `vector::push_back`, a `frightful_aura`/`frightfulaura` test-code typo, and a subsequent `0xc0000409` hard termination. These remain for the ability branch validation pass.'
          )

          Append-IfMissing 'TEST_REPORT.md' '## Windows self-hosted exhaustive main-front validation — 2026-08-10' @(
            '## Windows self-hosted exhaustive main-front validation — 2026-08-10'
            ''
            'Temporary validation PR #5 / Actions run `31417309122` executed the accumulated main-front test debt on the Windows self-hosted runner.'
            ''
            '```text'
            'MSVC Debug configure/build:                    PASS'
            'hwm-planner-tests Debug:                       PASS'
            'held-out planner validity:                     120/120 PASS, 0 invalid recommendations'
            'pairing/auth integration:                      PASS'
            'stale cancellation integration:                PASS'
            'live binding integration:                      PASS'
            'WebSocket integration:                         PASS'
            'Python pytest:                                 61/61 PASS'
            'TypeScript typecheck / extension build:        PASS / PASS'
            'MSVC Release build + main-front CTest:          PASS'
            'planner-demo 5000:                             PASS'
            'M11 multistep / uncertainty / selector / survival commands: PASS / PASS / PASS / PASS'
            '```'
            ''
            'The main-front C++ claim excludes the ability-owned monolithic `hwm-tests` executable. Windows/MSVC exposed a dangling-pointer Mighty Slam test, a misspelled Frightful Aura ability code, and then a later `0xc0000409` termination; those defects are handed to the independent ability branch rather than patched from main. Permanent main CI reflects this ownership split in `bb8404606621966d8c688f22e93c6ce35dd695ea`.'
            ''
            'M11 uncertainty reproducibility was then repaired in `8dc9dc5b81db936089c7764fafb9c22cb79505a3`. Dedicated run `31419316512` passed 7 targeted tests and produced byte-for-meaning identical JSON objects across two independent full-corpus processes. Runtime uncertainty fallback remains disabled.'
          )

          Append-IfMissing 'docs/MAIN_FRONT_STATUS.md' '## Executed Windows main-front validation checkpoint' @(
            '## Executed Windows main-front validation checkpoint'
            ''
            'The Windows self-hosted runner is now proven executable rather than merely configured. Temporary exhaustive run `31417309122` passed Debug/Release MSVC main-front C++, the permanent 120-state planner gate (120/120 valid, 0 invalid recommendations), pairing/auth, stale cancellation, live binding, WebSocket, Python 61/61, TypeScript/extension, `planner-demo 5000`, and all four M11 full-corpus evaluator commands.'
            ''
            'This run also closes the pending executable verification for the M13 canonical-hash regressions in `hwm-planner-tests`, including scheduler recency and semantic effect-provenance canonicalization.'
            ''
            'M11 uncertainty evidence is now reproducible under commit `8dc9dc5b81db936089c7764fafb9c22cb79505a3`: dedicated run `31419316512` passed 7 targeted tests and exact JSON equality across two independent full-corpus processes. The production uncertainty gate remains disabled by evidence.'
            ''
            'Permanent main CI commit `bb8404606621966d8c688f22e93c6ce35dd695ea` excludes the independently owned `hwm-tests` executable from the main-front CTest gate while leaving ability validation responsible for its Windows failures. The real authenticated active-PvE browser smoke remains the product-level blocker and is not replaced by replay/integration CI.'
          )

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/append_windows_migration_changelog.yml'
          git add changelog.md TEST_REPORT.md docs/MAIN_FRONT_STATUS.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No bookkeeping diff to commit.'
            exit 0
          }
          git commit -m 'docs: record exhaustive Windows main validation'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to commit validation bookkeeping.' }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Failed to refresh main before bookkeeping push.' }
          git rebase origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Failed to rebase validation bookkeeping onto current main.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Failed to push validation bookkeeping.' }
