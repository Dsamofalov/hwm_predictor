name: Apply verified Paw Strike hybrid patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_pawstrike_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install targeted verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          python -m pip install pytest numpy
      - name: Apply, verify, commit and log Paw Strike
        # v3 now verifies 174 source-matching I records directly from raw/state invariants.
        run: PYTHONPATH=python python .github/scripts/apply_pawstrike_patch_v3.py
