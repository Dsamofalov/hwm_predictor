name: One-shot M11 status synchronization

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'Dsamofalov/hwm_predictor' && github.event.pull_request.number == 2 && github.event.pull_request.head.ref == 'verify-m13-reroot' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify M11 evidence commit
        run: git merge-base --is-ancestor 45581ae7d0f844f67797c590c3ed529390b76f1f HEAD
      - name: Synchronize active M11 status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          section='''\n\n### 2026-08-10 M11 multi-step learned-dynamics gate\n\n- Functional evidence commit: `45581ae7d0f844f67797c590c3ed529390b76f1f`.\n- The first M11 **multi-step** submodel gate now exists for the existing primary physical-damage residual: five train-battle jackknife ensemble members, chronological held-out battles, and autoregressive evaluation at 2/4/8/16 halfturn horizons.\n- Non-primary transitions are teacher-forced in this gate so proc/collateral/resurrection errors are not misattributed to the damage residual. Predicted-invalid actions are preserved as divergence rather than silently corrected from replay.\n- Ensemble mean normalized force-L1 improves over the generic exact-formula baseline at every measured horizon: **0.01137 vs 0.01679 (2)**, **0.01791 vs 0.02728 (4)**, **0.02986 vs 0.04710 (8)**, **0.04947 vs 0.08125 (16)**.\n- This does **not** complete M11 or enable a learned world model in production: at 16 steps ensemble predicted-invalid-action fraction is **3.58%** vs **2.51%** generic and alive mismatch reaches **8.83%**. The next M11 gate is uncertainty/disagreement calibration and then broader structured-transition coverage.\n- Reproducible report: `data/reports/dynamics-multistep-damage.json`; diagnostic run `31384739406` and standard Linux/Windows CI run `31384739323` passed.\n'''
          marker='### 2026-08-10 M11 multi-step learned-dynamics gate'
          for name in ('SPEC.md','HeroesWM_Solver_TZ_Status_0.3.0.md'):
              p=Path(name);t=p.read_text(encoding='utf-8')
              if marker not in t:p.write_text(t.rstrip()+section+'\n',encoding='utf-8')
          p=Path('docs/MAIN_FRONT_STATUS.md');t=p.read_text(encoding='utf-8')
          status='''\n\n## M11 multi-step damage-residual gate\n\nFunctional evidence commit: `45581ae7d0f844f67797c590c3ed529390b76f1f`. The existing damage residual now has a reproducible five-member ensemble evaluation at 2/4/8/16 held-out halfturn horizons. Mean force-L1 beats the generic baseline at all horizons, but long-horizon invalid-action drift is worse, so runtime learned-world enablement remains disabled. M11 stays PARTIAL / EXPERIMENTAL.\n'''
          if '## M11 multi-step damage-residual gate' not in t:p.write_text(t.rstrip()+status+'\n',encoding='utf-8')
          p=Path('TEST_REPORT.md');t=p.read_text(encoding='utf-8')
          test='''\n\n## M11 multi-step damage-residual ensemble gate\n\nCommit `45581ae7d0f844f67797c590c3ed529390b76f1f` adds five targeted evaluator tests and `data/reports/dynamics-multistep-damage.json`. On 174 chronological held-out battles, the five-member train-only ensemble beats the generic baseline in mean normalized force-L1 at 2/4/8/16 halfturn horizons, while 16-step predicted-invalid-action fraction remains worse (3.58% vs 2.51%); production enablement therefore stays false. Diagnostic run `31384739406` and full standard CI run `31384739323` passed.\n'''
          if '## M11 multi-step damage-residual ensemble gate' not in t:p.write_text(t.rstrip()+test+'\n',encoding='utf-8')
          PY
          rm .github/workflows/main_m11_status_sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SPEC.md HeroesWM_Solver_TZ_Status_0.3.0.md docs/MAIN_FRONT_STATUS.md TEST_REPORT.md .github/workflows/main_m11_status_sync.yml
          git commit -m "docs: synchronize M11 multistep status"
          git push origin HEAD:main
