name: One-shot M11 selector bookkeeping

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write

jobs:
  bookkeep:
    if: github.repository == 'Dsamofalov/hwm_predictor' && github.event.pull_request.number == 2 && github.event.pull_request.head.ref == 'verify-m13-reroot' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify functional selector commit
        run: git merge-base --is-ancestor 7c5a4634da26b99ee5b74f824f98fe5dcce4dc5b HEAD
      - name: Append changelog and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('changelog.md');t=p.read_text(encoding='utf-8')
          sha='7c5a4634da26b99ee5b74f824f98fe5dcce4dc5b'
          if sha not in t:
              t=t.rstrip()+'''\n\n### M11 calibrated fallback-selector gate\n\n- Commit: `7c5a4634da26b99ee5b74f824f98fe5dcce4dc5b`\n  - Added a strict chronological **64% fit / 16% calibration / 20% final-test** fallback-selector experiment for the five-member primary physical-damage residual ensemble.\n  - Selector features are pre-transition only: creature/action train support, relative ensemble disagreement, residual-correction magnitude/sign, generic lethality ratio and ranged/melee indicator.\n  - Calibration chose threshold `0.5365`, using generic on about 16% of modeled attacks. On the untouched one-step final test, selector abs-log error is **0.38571**, slightly better than ensemble **0.38658** and generic **0.47968**; learned-worse AUC is **0.6020**.\n  - The **multi-step gate fails**: selector is slightly worse than pure ensemble mean-force-L1 at every 2/4/8/16 horizon and still exceeds generic invalid-action rate. At 16 steps: selector **0.05205 L1 / 3.24% invalid**, ensemble **0.05172 / 3.40%**, generic **0.08125 / 2.51%**.\n  - Runtime selector remains disabled. The experiment demonstrates that one-step fallback classification does not resolve the long-horizon accuracy/validity trade-off.\n  - Stored `data/reports/dynamics-selector-gate.json`. Diagnostic run `31386006048` and full standard CI run `31386005987`: **PASS**; targeted selector tests **4/4**.\n'''+'\n'
          p.write_text(t,encoding='utf-8')
          PY
          rm .github/workflows/main_m11_selector_bookkeeping.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog.md .github/workflows/main_m11_selector_bookkeeping.yml
          git commit -m "docs: record M11 selector gate"
          git push origin HEAD:main
