name: Apply local pairing auth patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_local_pairing_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Apply, verify, commit and log local pairing
        # v2 wrapper now preserves __file__ and publishes source/spec only.
        run: python .github/scripts/apply_local_pairing_patch_v2.py
