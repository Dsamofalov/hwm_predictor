name: One-shot M13 bookkeeping

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write

jobs:
  bookkeep:
    if: github.repository == 'Dsamofalov/hwm_predictor' && github.event.pull_request.number == 2 && github.event.pull_request.head.ref == 'verify-m13-reroot' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify tested functional lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6edec4d8360169060d280cd07a6e63de9c0fda89 HEAD
      - name: Record persistent re-root functional SHA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          p=Path('changelog.md'); t=p.read_text(encoding='utf-8')
          t=t.replace('5af650101bedab884dddfbb9ffeeb48abe8f075e9a12dd6609c258fc','5af650101bedab884dddfbb9ffeeb48abe8f2283')
          sha='135826c05d7f9b3d44e165ef6732bb6ede89a4c4'
          if sha not in t:
              t=t.rstrip()+'''\n\n### M13 persistent exact tree re-root\n\n- Commit: `135826c05d7f9b3d44e165ef6732bb6ede89a4c4`\n  - Made the planner graph persistent across recommendation calls and re-rooted only when the newly observed canonical `state_hash` already exists in the same battle/perspective search graph.\n  - Reused roots retain accumulated visits/statistics and prune unreachable old branches; unmatched observed states start a fresh graph rather than using approximate state matching.\n  - Moved the daemon to one persistent, mutex-protected Planner instance while preserving revision-bound cooperative cancellation through a request-specific callback.\n  - Added `/recommend` diagnostics: `tree_reused`, `reused_root_visits`, and `retained_nodes`.\n  - Extended the dedicated main-owned planner regression with exact reuse, pruning, and battle-scope reset checks.\n'''+'\n'
          p.write_text(t,encoding='utf-8')
          PY
          git add changelog.md
          git commit -m "docs: record M13 persistent re-root"
          git push origin HEAD:main
      - name: Record WebSocket harness functional SHA
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path
          p=Path('changelog.md'); t=p.read_text(encoding='utf-8'); sha='33aaea0cac7549972e4be93bf495d0a9dca7f301'
          if sha not in t:
              t=t.rstrip()+'''\n\n### WebSocket integration harness frame buffering\n\n- Commit: `33aaea0cac7549972e4be93bf495d0a9dca7f301`\n  - Fixed the raw RFC6455 regression client to preserve bytes received after the HTTP handshake delimiter instead of decoding a coalesced first WebSocket frame as UTF-8 headers.\n  - The server protocol was not relaxed; the test now correctly handles normal TCP packet coalescing.\n  - Final M13 verification run `31380236279` confirms the WebSocket streaming gate passes with this fix.\n'''+'\n'
          p.write_text(t,encoding='utf-8')
          PY
          git add changelog.md
          git commit -m "docs: record WebSocket harness buffering fix"
          git push origin HEAD:main
      - name: Record structural reuse guard SHA
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path
          p=Path('changelog.md'); t=p.read_text(encoding='utf-8'); sha='6edec4d8360169060d280cd07a6e63de9c0fda89'
          if sha not in t:
              t=t.rstrip()+'''\n\n### M13 persistent-reuse structural safety guard\n\n- Commit: `6edec4d8360169060d280cd07a6e63de9c0fda89`\n  - Added a conservative search-structure fingerprint for board bounds/blocked cells and static entity geometry/capability fields that are not currently part of the global `state_hash`.\n  - Persistent tree reuse now additionally requires the same non-empty battle id, perspective and structure fingerprint; otherwise the graph resets.\n  - Regression proves a legal-action-relevant `is_flyer` change that currently collides in `state_hash` does not reuse the old tree.\n  - Standard pull-request CI run `31380236279`: **PASS**. Linux passed C++ build, CTest 2/2, pairing/auth, stale cancellation, live binding, WebSocket streaming, full Python tests, TypeScript typecheck and extension build. Windows current-MSVC build/test job passed.\n'''+'\n'
          p.write_text(t,encoding='utf-8')
          PY
          git add changelog.md
          git commit -m "docs: record M13 re-root safety guard"
          git push origin HEAD:main
      - name: Synchronize active specification and reports and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path
          old='''2. **M13 chance-outcome correctness → transpositions/tree reuse:** текущий planner исторически хранит один `Edge.child`, хотя `sim_.apply(..., roll)` стохастический. Следующий main-planner набор должен индексировать sampled child outcomes по `state_hash`, не смешивать разные stochastic outcomes в одном первом child-node, затем добавить transposition sharing и только после этого persistent re-root между наблюдаемыми состояниями.\n3. **Decoder/legal correctness:** устранить 19 финальных structural-invalid replay без ослабления invariants и поднять held-out observed basic-action representability с **98.03%** к acceptance **>=99.9%**.'''
          new='''2. **M13 chance-outcome correctness / transpositions / persistent re-root — current correctness gate implemented:** sampled outcomes одного action разделены по canonical `state_hash`; одинаковые hashes используют общий per-search transposition node. Planner сохраняет граф между recommendation calls и переиспользует его только при точном observed hash в том же battle/perspective и при совпадающем conservative structure fingerprint; иначе строит новое дерево. Revision-bound stale cancellation остаётся обязательной и действует поверх reuse. Дальнейшее opponent/chance branching остаётся последующим качественным улучшением, а не prerequisite для безопасного reuse.\n3. **Decoder/legal correctness:** устранить 19 финальных structural-invalid replay без ослабления invariants и поднять held-out observed basic-action representability с **98.03%** к acceptance **>=99.9%**.'''
          for name in ('SPEC.md','HeroesWM_Solver_TZ_Status_0.3.0.md'):
              p=Path(name); t=p.read_text(encoding='utf-8')
              if old not in t: raise SystemExit(f'expected M13 status block not found in {name}')
              t=t.replace(old,new,1)
              t=t.replace('**Последнее обновление реализации:** 10.08.2026 — основной front: persistent pairing/bearer auth, revision-bound cooperative stale-search cancellation, live revision/hash trace/binding, authenticated local WebSocket streaming и Linux + Windows/MSVC CI gates реализованы; ability-front ведётся отдельно в ветке `ability`.','**Последнее обновление реализации:** 10.08.2026 — основной front: local auth/live WebSocket loop закрыт на integration-fixtures; M13 stochastic outcome separation, transpositions и conservative persistent exact re-root реализованы и прошли Linux + Windows/MSVC CI; real authenticated active-battle smoke всё ещё обязателен; ability-front ведётся отдельно в ветке `ability`.',1)
              p.write_text(t,encoding='utf-8')
          p=Path('docs/MAIN_FRONT_STATUS.md'); t=p.read_text(encoding='utf-8')
          marker='## M13 stochastic search correctness and persistent re-root'
          if marker not in t:
              t=t.rstrip()+'''\n\n## M13 stochastic search correctness and persistent re-root\n\nFunctional commits:\n\n- `d06217fd4aa531aa0e49cf7c8c2495a5ab0ca5e4` — per-action stochastic outcomes keyed by canonical state hash + per-search transpositions.\n- `135826c05d7f9b3d44e165ef6732bb6ede89a4c4` — persistent planner graph and exact observed-state re-root with reachable-subgraph pruning.\n- `6edec4d8360169060d280cd07a6e63de9c0fda89` — conservative static structure fingerprint guard for safe reuse.\n- `33aaea0cac7549972e4be93bf495d0a9dca7f301` — RFC6455 integration harness buffering fix exposed by the new verification run.\n\nCurrent behavior: a stochastic action may retain multiple canonical outcome children; equal canonical outcome hashes share one node. Across observed revisions, reuse occurs only for an exact predicted hash in the same non-empty battle/perspective and matching board/static-structure fingerprint. Otherwise search starts fresh. Revision change still cancels stale in-flight search.\n\nVerification: standard CI run `31380236279` PASS on Linux and Windows. The immediate product gate remains the real authenticated active-battle smoke test; M01/M14 are not promoted to COMPLETE by planner work. The next autonomous main correctness front is attribution of the 19 structural-invalid finals and legal-action representability improvement toward >=99.9%.\n'''+'\n'
              p.write_text(t,encoding='utf-8')
          additions={
            'TEST_REPORT.md':'''\n\n## M13 stochastic outcome / persistent re-root verification\n\nFunctional commits `d06217fd4aa531aa0e49cf7c8c2495a5ab0ca5e4`, `135826c05d7f9b3d44e165ef6732bb6ede89a4c4`, and `6edec4d8360169060d280cd07a6e63de9c0fda89` add a dedicated `hwm-planner-tests` target covering distinct stochastic outcome nodes/legal sets, equal-hash transpositions, exact persistent root reuse, reachable-subgraph pruning, battle reset, and static-structure mismatch reset. WebSocket harness commit `33aaea0cac7549972e4be93bf495d0a9dca7f301` handles coalesced handshake/frame bytes without weakening protocol checks. Standard CI run `31380236279`: PASS; Linux CTest 2/2 plus all daemon integrations, Python tests, TypeScript and extension build passed; Windows current-MSVC build/test passed.\n''',
            'IMPLEMENTATION_REPORT.md':'''\n\n## M13 persistent stochastic search update — 2026-08-10\n\nThe historical single-child stochastic edge is removed. Action edges retain outcome bindings keyed by canonical state hash, a per-search transposition graph shares equal states, and the daemon now keeps one mutex-protected Planner whose search graph can be re-rooted on an exactly predicted observed state. Reuse is conservative: same non-empty battle id, perspective, canonical root hash and static structure fingerprint are all required; otherwise the graph resets. Unreachable pre-root nodes are pruned. Revision-bound stale cancellation remains authoritative. Functional SHAs: `d06217fd4aa531aa0e49cf7c8c2495a5ab0ca5e4`, `135826c05d7f9b3d44e165ef6732bb6ede89a4c4`, `6edec4d8360169060d280cd07a6e63de9c0fda89`. CI run `31380236279`: PASS.\n''',
            'HeroesWM_Solver_Implementation_Report_0.3.0.md':'''\n\n## M13 persistent stochastic search update — 2026-08-10\n\nThe historical single-child stochastic edge is removed. Action edges retain outcome bindings keyed by canonical state hash, a per-search transposition graph shares equal states, and the daemon now keeps one mutex-protected Planner whose search graph can be re-rooted on an exactly predicted observed state. Reuse is conservative: same non-empty battle id, perspective, canonical root hash and static structure fingerprint are all required; otherwise the graph resets. Unreachable pre-root nodes are pruned. Revision-bound stale cancellation remains authoritative. Functional SHAs: `d06217fd4aa531aa0e49cf7c8c2495a5ab0ca5e4`, `135826c05d7f9b3d44e165ef6732bb6ede89a4c4`, `6edec4d8360169060d280cd07a6e63de9c0fda89`. CI run `31380236279`: PASS.\n'''
          }
          for name,entry in additions.items():
              p=Path(name); t=p.read_text(encoding='utf-8'); marker=entry.strip().splitlines()[0]
              if marker not in t: p.write_text(t.rstrip()+entry+'\n',encoding='utf-8')
          PY
          rm .github/workflows/main_m13_bookkeeping.yml
          git add SPEC.md HeroesWM_Solver_TZ_Status_0.3.0.md docs/MAIN_FRONT_STATUS.md TEST_REPORT.md IMPLEMENTATION_REPORT.md HeroesWM_Solver_Implementation_Report_0.3.0.md .github/workflows/main_m13_bookkeeping.yml
          git commit -m "docs: synchronize M13 persistent planner status"
          git push origin HEAD:main
