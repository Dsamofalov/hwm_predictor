name: One-shot M11 uncertainty bookkeeping

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write

jobs:
  bookkeep:
    if: github.repository == 'Dsamofalov/hwm_predictor' && github.event.pull_request.number == 2 && github.event.pull_request.head.ref == 'verify-m13-reroot' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify functional uncertainty commit
        run: git merge-base --is-ancestor ef35d28aca6a044019896e3ecf6c4d4b52113d6f HEAD
      - name: Append changelog and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('changelog.md');t=p.read_text(encoding='utf-8')
          sha='ef35d28aca6a044019896e3ecf6c4d4b52113d6f'
          if sha not in t:
              t=t.rstrip()+'''\n\n### M11 dynamics uncertainty calibration\n\n- Commit: `ef35d28aca6a044019896e3ecf6c4d4b52113d6f`\n  - Added held-out calibration of the five-member damage-residual ensemble disagreement against absolute force error, learned-vs-generic excess error and invalid-action drift at 2/4/8/16 halfturn horizons.\n  - Added tie-safe Spearman/AUC utilities, decile calibration tables and five targeted tests.\n  - Disagreement tracks absolute ensemble error at every horizon (Spearman **0.589 / 0.659 / 0.666 / 0.630**), so it is a useful epistemic-drift indicator.\n  - However, disagreement does **not** identify windows where learned dynamics underperform generic: AUC is **0.472 / 0.431 / 0.390 / 0.318**, and disagreement is negatively correlated with learned-minus-generic excess L1.\n  - Therefore a naive high-disagreement fallback to generic is explicitly rejected and production uncertainty gating remains disabled.\n  - Stored compact evidence at `data/reports/dynamics-uncertainty-calibration.json`; the CLI emits full ten-bin calibration tables.\n  - Full-corpus calibration run `31385464567` and standard Linux/Windows CI run `31385464568`: **PASS**; targeted calibration tests **5/5**.\n'''+'\n'
          p.write_text(t,encoding='utf-8')
          PY
          rm .github/workflows/main_m11_uncertainty_bookkeeping.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog.md .github/workflows/main_m11_uncertainty_bookkeeping.yml
          git commit -m "docs: record M11 uncertainty calibration"
          git push origin HEAD:main
