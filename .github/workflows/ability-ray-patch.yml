name: Ability Ray Exact Patch

on:
  push:
    branches: [ability]
    paths:
      - '.github/workflows/ability-ray-patch.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ability
          fetch-depth: 0

      - name: Apply exact replay mapping and dispatch Ability CI
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'python/hwm_solver/protocol/replay.py'
          $text = [System.IO.File]::ReadAllText($path)
          $nl = if ($text.Contains("`r`n")) { "`r`n" } else { "`n" }
          $old = '    "cnf": "confusion", "sff": "suffering",' + $nl + '}'
          $new = '    "cnf": "confusion", "sff": "suffering", "ray": "dray",' + $nl + '}'
          $hits = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($hits -ne 1) { throw "Expected exactly one status-map insertion point, found $hits" }
          if ($text.Contains('"ray": "dray"')) { throw 'ray mapping already present before patch' }
          $updated = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $updated, [System.Text.UTF8Encoding]::new($false))

          Remove-Item '.github/workflows/ability-ray-patch.yml'
          git diff --check
          $numstat = (git diff --numstat -- $path).Trim()
          if ($numstat -notmatch '^1\s+1\s+python/hwm_solver/protocol/replay\.py$') {
            throw "Unexpected replay diff cardinality: $numstat"
          }
          $patch = (git diff -- $path) -join "`n"
          if ($patch -notmatch '\+\s+"cnf": "confusion", "sff": "suffering", "ray": "dray",') {
            throw 'Expected ray mapping is absent from replay diff'
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path '.github/workflows/ability-ray-patch.yml'
          git diff --cached --check
          git commit -m 'fix(ability): decode shared ray status wire'
          git push origin HEAD:ability

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{ ref = 'ability' } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/Dsamofalov/hwm_predictor/actions/workflows/ability.yml/dispatches' -Headers $headers -ContentType 'application/json' -Body $body
