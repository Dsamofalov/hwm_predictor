name: One-shot documentation checkpoint sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs_checkpoint_sync.yml'

permissions:
  contents: write

jobs:
  sync:
    # The workflow already exists before this triggering push; it removes itself after success.
    if: github.repository == 'Dsamofalov/hwm_predictor'
    runs-on: [self-hosted, windows, x64, hwm-windows]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Refresh checkpoint docs
        shell: powershell
        run: .\.github\scripts\docs_checkpoint_sync.ps1
