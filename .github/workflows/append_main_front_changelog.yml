name: Append main-front changelog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append_main_front_changelog.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Append verified main-front entries
        run: python .github/scripts/append_main_front_changelog.py
