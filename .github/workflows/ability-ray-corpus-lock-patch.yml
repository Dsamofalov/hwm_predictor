name: Ability Ray Corpus Diagnostics

on:
  push:
    branches: [ability]
    paths:
      - '.github/workflows/ability-ray-corpus-lock-patch.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ability
          fetch-depth: 1
      - name: Bootstrap exact ability Python environment
        shell: pwsh
        run: .\scripts\ci_ability_windows.ps1 -Mode PythonInventory
      - name: Print ray-sensitive exact aggregates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $code = @'
          import json
          from pathlib import Path
          from hwm_solver.ability.childofthelight_evidence import analyze_corpus as child
          from hwm_solver.ability.childofthelight_spellwire_evidence import analyze_spellwire_corpus as child_wire
          from hwm_solver.ability.hexingattack_evidence import analyze_corpus as hexing
          root = Path('hwm_battles')
          c = child(root)
          w = child_wire(root)
          h = hexing(root)
          keep_c = ['carrier_targeted_specials','carrier_targeted_codes','code_copy_candidates','code_solo_carrier_records','copy_target_counts','copy_value_equal','copy_amount_equal','carrier_added_effects']
          keep_w = ['status_groups_with_carrier','status_groups_positive_cost','status_groups_without_positive_cost','status_groups_without_source_spellbook','status_codes','positive_costs','light_status_groups','light_match_codes','light_single_groups','light_mass_groups','light_ambiguous_groups','light_single_copy_groups','light_single_direct_carrier_groups','light_mass_control_groups','light_single_copy_carrier_records','single_copy_codes','single_direct_codes','mass_control_codes','ambiguous_codes','direct_damage_carrier_records','direct_damage_codes','raise_dead_carrier_records']
          keep_h = ['attacks_with_same_target_special','same_target_special_records','same_target_codes','code_added_effects','code_value_shapes','code_amount_shapes','other_special_codes']
          print('CHILD_RAY_EXACT=' + json.dumps({k:c[k] for k in keep_c}, ensure_ascii=False, sort_keys=True))
          print('CHILD_WIRE_RAY_EXACT=' + json.dumps({k:w[k] for k in keep_w}, ensure_ascii=False, sort_keys=True))
          print('HEXING_RAY_EXACT=' + json.dumps({k:h[k] for k in keep_h}, ensure_ascii=False, sort_keys=True))
          '@
          .\.venv\Scripts\python.exe -c $code
          if ($LASTEXITCODE -ne 0) { throw "diagnostic failed with exit code $LASTEXITCODE" }
