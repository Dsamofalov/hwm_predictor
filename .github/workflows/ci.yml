name: CI

on:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}

jobs:
  windows-self-hosted:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, x64, hwm-windows]
    timeout-minutes: 240
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Resolve preinstalled Python 3.13
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $candidates = New-Object System.Collections.Generic.List[string]

          if (Get-Command py -ErrorAction SilentlyContinue) {
            try {
              $p = (& py -3.13 -c "import sys; print(sys.executable)" 2>$null | Select-Object -Last 1)
              if ($LASTEXITCODE -eq 0 -and $p) { $candidates.Add($p.Trim()) }
            } catch {}
          }

          if ($env:RUNNER_TOOL_CACHE) {
            Get-ChildItem -Path (Join-Path $env:RUNNER_TOOL_CACHE 'Python\3.13*\x64\python.exe') -ErrorAction SilentlyContinue |
              ForEach-Object { $candidates.Add($_.FullName) }
          }

          Get-ChildItem -Path 'C:\Users\*\AppData\Roaming\uv\python\cpython-3.13-windows-x86_64-none\python.exe' -ErrorAction SilentlyContinue |
            ForEach-Object { $candidates.Add($_.FullName) }

          $basePython = $null
          foreach ($candidate in ($candidates | Select-Object -Unique)) {
            if (-not (Test-Path $candidate)) { continue }
            & $candidate -c "import sys, venv; raise SystemExit(0 if sys.version_info[:2] == (3, 13) else 1)" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $basePython = $candidate
              break
            }
          }

          if (-not $basePython) {
            throw 'No usable preinstalled Python 3.13 found. Run the HWM Windows prerequisite bootstrap on the runner machine.'
          }

          Write-Host "Using base Python: $basePython"
          & $basePython -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create workspace virtualenv.' }

          $venvScripts = (Resolve-Path '.venv\Scripts').Path
          $venvRoot = (Resolve-Path '.venv').Path
          $venvScripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VIRTUAL_ENV=$venvRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & '.venv\Scripts\python.exe' --version
          & '.venv\Scripts\python.exe' -m pip --version

      - name: Verify preinstalled Node 22+
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) { throw 'node.exe not found in runner PATH.' }
          if (-not (Get-Command npm -ErrorAction SilentlyContinue)) { throw 'npm not found in runner PATH.' }
          $v = (& node --version).Trim()
          if ($v -notmatch '^v(\d+)\.') { throw "Cannot parse Node version: $v" }
          if ([int]$Matches[1] -lt 22) { throw "Node 22+ required; found $v" }
          Write-Host "Node: $v"
          Write-Host "npm: $(& npm --version)"

      - name: Configure and build C++ Debug with current MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64
          where cl
          where cmake
          where ninja
          cmake -S . -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=Debug -DHWM_BUILD_TESTS=ON
          cmake --build build/windows --parallel 2

      - name: C++ Debug tests
        run: ctest --test-dir build/windows --output-on-failure

      - name: Held-out 120-state planner recommendation validity
        run: python scripts/test_planner_replay_gate.py build/windows/planner-eval.exe hwm_battles 120 1 120

      - name: Local API pairing/auth integration
        run: python scripts/test_local_api_auth.py build/windows/solver-daemon.exe

      - name: Stale search cancellation integration
        run: python scripts/test_stale_cancellation.py build/windows/solver-daemon.exe

      - name: Live recommendation binding contract
        run: python scripts/test_live_binding.py build/windows/solver-daemon.exe

      - name: WebSocket revision streaming
        run: python scripts/test_websocket_stream.py build/windows/solver-daemon.exe

      - name: Install Python package
        run: python -m pip install -e ".[dev]"

      - name: Python tests
        run: python -m pytest python/tests -q

      - name: Install extension dependencies
        working-directory: extension
        run: npm install --no-audit --no-fund

      - name: TypeScript typecheck
        working-directory: extension
        run: npm run typecheck

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Configure, build and test C++ Release
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64
          cmake -S . -B build/windows-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DHWM_BUILD_TESTS=ON
          cmake --build build/windows-release --parallel 2
          ctest --test-dir build/windows-release --output-on-failure
          build\windows-release\planner-demo.exe 5000

      - name: M11 full-corpus multistep residual gate
        run: python -m hwm_solver.evaluation.dynamics_multistep hwm_battles --out build/validation/dynamics-multistep-damage.json

      - name: M11 full-corpus uncertainty calibration
        run: python -m hwm_solver.evaluation.dynamics_uncertainty hwm_battles --out build/validation/dynamics-uncertainty-calibration.json

      - name: M11 full-corpus selector gate
        run: python -m hwm_solver.evaluation.dynamics_selector hwm_battles --out build/validation/dynamics-selector-gate.json

      - name: M11 stochastic survival-distribution gate
        run: python -m hwm_solver.evaluation.dynamics_survival_gate hwm_battles --out build/validation/m11_dynamics_survival_gate.json

      - name: Verify regenerated M11 evidence matches committed reports
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          @'
          import json
          from pathlib import Path

          pairs = [
              ("build/validation/dynamics-multistep-damage.json", "data/reports/dynamics-multistep-damage.json"),
              ("build/validation/dynamics-uncertainty-calibration.json", "data/reports/dynamics-uncertainty-calibration.json"),
              ("build/validation/dynamics-selector-gate.json", "data/reports/dynamics-selector-gate.json"),
              ("build/validation/m11_dynamics_survival_gate.json", "data/reports/m11_dynamics_survival_gate.json"),
          ]
          for generated_path, committed_path in pairs:
              generated = json.loads(Path(generated_path).read_text(encoding="utf-8"))
              committed = json.loads(Path(committed_path).read_text(encoding="utf-8"))
              generated.pop("validation", None)
              committed.pop("validation", None)
              if generated != committed:
                  raise SystemExit(f"reproducibility mismatch: {committed_path}")
              print(f"MATCH: {committed_path}")
          '@ | python -
