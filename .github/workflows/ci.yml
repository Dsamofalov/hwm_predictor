name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'

jobs:
  core:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, windows, x64, hwm-windows]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Core Windows validation
        run: .\scripts\ci_windows.ps1 -Suite Core

  full:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, windows, x64, hwm-windows]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Full Windows validation
        run: .\scripts\ci_windows.ps1 -Suite Full
