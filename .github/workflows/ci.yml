name: CI

on:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}

jobs:
  windows-self-hosted:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, x64, hwm-windows]
    timeout-minutes: 240
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Bootstrap service-owned uv and Python 3.13
        run: |
          $ErrorActionPreference = 'Stop'
          $uvVersion = '0.11.32'
          $uvDir = Join-Path $env:RUNNER_TOOL_CACHE "uv\$uvVersion"
          $uvExe = Join-Path $uvDir 'uv.exe'
          $pythonDir = Join-Path $env:RUNNER_TOOL_CACHE 'uv-python'
          $uvCache = Join-Path $env:RUNNER_TOOL_CACHE 'uv-cache'

          New-Item -ItemType Directory -Force $uvDir, $pythonDir, $uvCache | Out-Null

          if (-not (Test-Path $uvExe)) {
            Write-Host "Installing portable uv $uvVersion into $uvDir"
            $env:UV_UNMANAGED_INSTALL = $uvDir
            $installer = Invoke-RestMethod "https://astral.sh/uv/$uvVersion/install.ps1"
            Invoke-Expression $installer
          }

          if (-not (Test-Path $uvExe)) { throw "uv.exe not found after installation: $uvExe" }

          $env:UV_PYTHON_INSTALL_DIR = $pythonDir
          $env:UV_CACHE_DIR = $uvCache
          $env:UV_MANAGED_PYTHON = '1'

          & $uvExe --version
          & $uvExe python install 3.13 --install-dir $pythonDir
          if ($LASTEXITCODE -ne 0) { throw 'uv python install 3.13 failed.' }

          if (Test-Path '.venv') { Remove-Item -Recurse -Force '.venv' }
          & $uvExe venv --python 3.13 --managed-python .venv
          if ($LASTEXITCODE -ne 0) { throw 'uv venv failed.' }

          $venvScripts = (Resolve-Path '.venv\Scripts').Path
          $venvRoot = (Resolve-Path '.venv').Path
          $uvDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $venvScripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VIRTUAL_ENV=$venvRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UV_PYTHON_INSTALL_DIR=$pythonDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UV_CACHE_DIR=$uvCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UV_MANAGED_PYTHON=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & '.venv\Scripts\python.exe' --version
          & $uvExe pip install --python '.venv\Scripts\python.exe' -e '.[dev]'
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed.' }

      - name: Resolve system Node and CMake
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($dir in @('C:\Program Files\nodejs', 'C:\Program Files\CMake\bin')) {
            if (Test-Path $dir) {
              $env:Path = "$dir;$env:Path"
              $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

          if (-not (Get-Command node -ErrorAction SilentlyContinue)) { throw 'node.exe not found.' }
          if (-not (Get-Command npm -ErrorAction SilentlyContinue)) { throw 'npm not found.' }
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) { throw 'cmake.exe not found.' }

          $nodeVersion = (& node --version).Trim()
          if ($nodeVersion -notmatch '^v(\d+)\.') { throw "Cannot parse Node version: $nodeVersion" }
          if ([int]$Matches[1] -lt 22) { throw "Node 22+ required; found $nodeVersion" }
          Write-Host "Node: $nodeVersion"
          Write-Host "npm: $(& npm --version)"
          Write-Host ((& cmake --version | Select-Object -First 1))

      - name: Temporary validation guard for Mighty Slam test pointer lifetime
        run: |
          $path = 'cpp/tests/test_main.cpp'
          $text = Get-Content -Raw -Encoding UTF8 $path
          $needle = '    s.entities.push_back(secondary);s.entities.push_back(friendly);s.entities.push_back(far);s.entities.push_back(big);'
          $replacement = $needle + "`n    actor=s.entity(1);primary=s.entity(2);CHECK(actor&&primary); // validation-only: vector push_back invalidates saved pointers"
          if (-not $text.Contains($needle)) { throw 'Mighty Slam test patch anchor not found.' }
          $patched = $text.Replace($needle, $replacement)
          if ($patched -eq $text) { throw 'Mighty Slam test validation patch did not apply.' }
          Set-Content -Path $path -Value $patched -Encoding UTF8
          Write-Host 'Applied validation-only pointer-lifetime guard. Production/ability source is unchanged.'

      - name: Configure and build C++ Debug with Visual Studio 2022
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found.' }
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $vs) { throw 'Visual Studio C++ x64 toolchain not found.' }
          Write-Host "Visual Studio: $vs"
          cmake -S . -B build/windows -G 'Visual Studio 17 2022' -A x64 -DHWM_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake Debug configure failed.' }
          cmake --build build/windows --config Debug --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'C++ Debug build failed.' }

      - name: C++ Debug tests
        run: ctest --test-dir build/windows -C Debug --output-on-failure

      - name: Held-out 120-state planner recommendation validity
        run: python scripts/test_planner_replay_gate.py build/windows/Debug/planner-eval.exe hwm_battles 120 1 120

      - name: Local API pairing/auth integration
        run: python scripts/test_local_api_auth.py build/windows/Debug/solver-daemon.exe

      - name: Stale search cancellation integration
        run: python scripts/test_stale_cancellation.py build/windows/Debug/solver-daemon.exe

      - name: Live recommendation binding contract
        run: python scripts/test_live_binding.py build/windows/Debug/solver-daemon.exe

      - name: WebSocket revision streaming
        run: python scripts/test_websocket_stream.py build/windows/Debug/solver-daemon.exe

      - name: Python tests
        run: python -m pytest python/tests -q

      - name: Install extension dependencies
        working-directory: extension
        run: npm install --no-audit --no-fund

      - name: TypeScript typecheck
        working-directory: extension
        run: npm run typecheck

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Configure, build and test C++ Release
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build/windows-release -G 'Visual Studio 17 2022' -A x64 -DHWM_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake Release configure failed.' }
          cmake --build build/windows-release --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'C++ Release build failed.' }
          ctest --test-dir build/windows-release -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'C++ Release tests failed.' }
          & 'build\windows-release\Release\planner-demo.exe' 5000
          if ($LASTEXITCODE -ne 0) { throw 'Release planner benchmark failed.' }

      - name: M11 full-corpus multistep residual gate
        run: python -m hwm_solver.evaluation.dynamics_multistep hwm_battles --out build/validation/dynamics-multistep-damage.json

      - name: M11 full-corpus uncertainty calibration
        run: python -m hwm_solver.evaluation.dynamics_uncertainty hwm_battles --out build/validation/dynamics-uncertainty-calibration.json

      - name: M11 full-corpus selector gate
        run: python -m hwm_solver.evaluation.dynamics_selector hwm_battles --out build/validation/dynamics-selector-gate.json

      - name: M11 stochastic survival-distribution gate
        run: python -m hwm_solver.evaluation.dynamics_survival_gate hwm_battles --out build/validation/m11_dynamics_survival_gate.json

      - name: Verify regenerated M11 evidence matches committed reports
        run: |
          @'
          import json
          from pathlib import Path

          pairs = [
              ("build/validation/dynamics-multistep-damage.json", "data/reports/dynamics-multistep-damage.json"),
              ("build/validation/dynamics-uncertainty-calibration.json", "data/reports/dynamics-uncertainty-calibration.json"),
              ("build/validation/dynamics-selector-gate.json", "data/reports/dynamics-selector-gate.json"),
              ("build/validation/m11_dynamics_survival_gate.json", "data/reports/m11_dynamics_survival_gate.json"),
          ]
          for generated_path, committed_path in pairs:
              generated = json.loads(Path(generated_path).read_text(encoding="utf-8"))
              committed = json.loads(Path(committed_path).read_text(encoding="utf-8"))
              generated.pop("validation", None)
              committed.pop("validation", None)
              if generated != committed:
                  raise SystemExit(f"reproducibility mismatch: {committed_path}")
              print(f"MATCH: {committed_path}")
          '@ | python -
