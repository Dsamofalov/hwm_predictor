name: Ability Current Reports Regen Once

on:
  push:
    branches: [ability]
    paths:
      - '.github/workflows/ability_reports_regen_once.yml'

permissions:
  contents: write
  actions: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install report runtime dependency
        run: python -m pip install --disable-pip-version-check 'numpy>=2.0'
      - name: Regenerate canonical current reports
        env:
          PYTHONPATH: python
        run: |
          python python/hwm_solver/knowledge/build_ability_registry.py \
            data/catalog/generated_v4.json \
            --out data/catalog/ability_registry.json \
            --ability-damage models/ability_damage_model.csv \
            --collateral models/collateral_model.csv \
            --proc models/proc_model.csv \
            --kill-trigger models/kill_trigger_model.csv \
            > data/reports/ability-registry-current.json
          git diff --exit-code -- data/catalog/ability_registry.json data/catalog/ability_registry.csv
          python -m hwm_solver.evaluation.ability_risk_report \
            hwm_battles \
            --registry data/catalog/ability_registry.json \
            --out data/reports/ability-risk-current.json \
            > /tmp/ability-risk-current.stdout.json
          git diff --stat -- data/reports/ability-registry-current.json data/reports/ability-risk-current.json
          if git diff --quiet -- data/reports/ability-registry-current.json data/reports/ability-risk-current.json; then
            echo 'Canonical current report regeneration produced no changes.' >&2
            exit 1
          fi
      - name: Commit canonical reports and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reports/ability-registry-current.json data/reports/ability-risk-current.json
          git rm .github/workflows/ability_reports_regen_once.yml
          git commit -m 'chore(ability): regenerate current ability reports'
          git push origin HEAD:ability
      - name: Validate exact report artifact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ability.yml --ref ability
