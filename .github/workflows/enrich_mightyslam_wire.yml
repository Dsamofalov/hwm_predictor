name: Enrich Mighty Slam wire evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enrich_mightyslam_wire.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Decode all damage and forced-position records
        env:
          PYTHONPATH: python
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from hwm_solver.protocol.replay import parse_commands
          path=Path('data/reports/mightyslam_msl_evidence.json')
          r=json.loads(path.read_text(encoding='utf-8'))
          damage_counts={}; forced_counts={}; multi_damage=0; forced_rows=0
          for row in r['rows']:
              cmds=parse_commands(row['raw'])
              damages=[{'actor_uid':c.actor_uid,'target_uid':c.target_uid,'amount':c.amount} for c in cmds if c.opcode=='DAMAGE']
              forced=[{'uid':c.actor_uid if c.actor_uid is not None else c.target_uid,'target_uid':c.target_uid,'x':c.x,'y':c.y,'raw':c.raw} for c in cmds if c.opcode=='FORCED_POSITION']
              row['damage_events']=damages; row['forced_positions']=forced
              damage_counts[str(len(damages))]=damage_counts.get(str(len(damages)),0)+1
              forced_counts[str(len(forced))]=forced_counts.get(str(len(forced)),0)+1
              multi_damage += int(len(damages)>1); forced_rows += int(bool(forced))
          r['damage_event_count_distribution']=damage_counts
          r['forced_position_count_distribution']=forced_counts
          r['rows_with_multiple_damage_targets']=multi_damage
          r['rows_with_forced_position']=forced_rows
          path.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:r[k] for k in ['observed','damage_event_count_distribution','forced_position_count_distribution','rows_with_multiple_damage_targets','rows_with_forced_position']},indent=2))
          PY
      - name: Commit enriched evidence and log
        run: |
          rm .github/workflows/enrich_mightyslam_wire.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data: enrich Mighty Slam wire evidence'
          REPORT_SHA=$(git rev-parse HEAD)
          export REPORT_SHA STAGING_SHA="$GITHUB_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('data/reports/mightyslam_msl_evidence.json').read_text(encoding='utf-8'))
          p=Path('changelog.md');text=p.read_text(encoding='utf-8').rstrip()+'\n\n'
          text += f'''### Mighty Slam damage/knockback wire enrichment\n\n- Commit: `{os.environ['STAGING_SHA']}`\n  - Staged a self-removing canonical `parse_commands()` pass over all isolated `Smsl` records.\n- Commit: `{os.environ['REPORT_SHA']}`\n  - Enriched `data/reports/mightyslam_msl_evidence.json` with every `DAMAGE` and `FORCED_POSITION` record.\n  - Damage-event count distribution: `{r['damage_event_count_distribution']}`; multi-target damage rows: **{r['rows_with_multiple_damage_targets']}/{r['observed']}**.\n  - Forced-position count distribution: `{r['forced_position_count_distribution']}`; rows with knockback: **{r['rows_with_forced_position']}/{r['observed']}**.\n'''
          p.write_text(text,encoding='utf-8')
          PY
          git add changelog.md
          git commit -m 'docs: log Mighty Slam wire enrichment'
          git push origin HEAD:main
