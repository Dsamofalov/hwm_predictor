name: One-shot specification checkpoint sync

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/spec_checkpoint_sync.py'
      - '.github/workflows/spec_checkpoint_sync.yml'

permissions:
  contents: write
  statuses: write

jobs:
  sync:
    # Public hosted Windows run; the sync commit removes this workflow and both temporary patchers.
    if: github.repository == 'Dsamofalov/hwm_predictor'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Publish docs-sync pending status
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA"
          $target = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = @{ state = 'pending'; context = 'HWM / Docs Sync'; description = 'Specification sync running'; target_url = $target } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri $uri -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } -ContentType 'application/json' -Body $body | Out-Null
      - name: Refresh active specification checkpoint
        shell: powershell
        run: python .\.github\scripts\spec_checkpoint_sync.py
      - name: Publish docs-sync final status
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          HWM_JOB_STATUS: ${{ job.status }}
        run: |
          $state = if ($env:HWM_JOB_STATUS -eq 'success') { 'success' } else { 'failure' }
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA"
          $target = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = @{ state = $state; context = 'HWM / Docs Sync'; description = "Specification sync: $env:HWM_JOB_STATUS"; target_url = $target } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri $uri -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } -ContentType 'application/json' -Body $body | Out-Null
