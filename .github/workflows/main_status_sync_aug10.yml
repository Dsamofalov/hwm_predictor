name: One-shot current main status synchronization

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'Dsamofalov/hwm_predictor' && github.event.pull_request.number == 2 && github.event.pull_request.head.ref == 'verify-m13-reroot' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify current evidence commits
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ef35d28aca6a044019896e3ecf6c4d4b52113d6f HEAD
          git merge-base --is-ancestor 7c5a4634da26b99ee5b74f824f98fe5dcce4dc5b HEAD
          git merge-base --is-ancestor cde38a5a89684ff2691c80eeb3583195ffa31758 HEAD
      - name: Synchronize specification and reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          m11='''\n\n### 2026-08-10 M11 uncertainty and fallback-selector follow-up\n\n- Uncertainty calibration commit `ef35d28aca6a044019896e3ecf6c4d4b52113d6f` shows ensemble disagreement is informative for **absolute** multi-step drift (Spearman 0.589/0.659/0.666/0.630 at 2/4/8/16 halfturns), but it does **not** identify windows where learned dynamics are worse than generic (AUC 0.472/0.431/0.390/0.318). A naive high-disagreement fallback is therefore rejected.\n- Calibrated selector commit `7c5a4634da26b99ee5b74f824f98fe5dcce4dc5b` uses a strict 64% fit / 16% calibration / 20% final-test split. It slightly improves one-step abs-log error, but is worse than the pure ensemble on multi-step mean force-L1 and still above the generic invalid-action rate. Runtime selector remains disabled.\n- M11 remains **PARTIAL / EXPERIMENTAL**. The next useful learned-dynamics work is to reduce the concrete invalid-action/survival divergence itself, not add another one-step fallback classifier.\n'''
          evals='''\n\n### 2026-08-10 held-out planner recommendation-validity acceptance\n\n- Functional commit `cde38a5a89684ff2691c80eeb3583195ffa31758` makes a deterministic **120-state** chronological held-out planner validity gate part of standard Linux CI.\n- The sample spans **109 distinct held-out battles**. At the permanent 120-simulation gate: **120/120** recommendations are valid, with **0** canonical-hash mismatches, illegal best actions, illegal alternatives, non-finite metrics or other invalid recommendations.\n- A stronger 80 -> 300 simulation stress reference also passes 120/120; action-type stability is 98.33% and exact-action stability 85%.\n- This satisfies the **replay** half of the >=100-state invalid-recommendation acceptance requirement. It does **not** replace the required real authenticated active-battle smoke / live-state gate; M14 cannot be declared fully complete from replay alone.\n'''
          for name in ('SPEC.md','HeroesWM_Solver_TZ_Status_0.3.0.md'):
              p=Path(name);t=p.read_text(encoding='utf-8')
              if '### 2026-08-10 M11 uncertainty and fallback-selector follow-up' not in t:t=t.rstrip()+m11
              if '### 2026-08-10 held-out planner recommendation-validity acceptance' not in t:t=t.rstrip()+evals
              p.write_text(t+'\n',encoding='utf-8')
          p=Path('docs/MAIN_FRONT_STATUS.md');t=p.read_text(encoding='utf-8')
          s='''\n\n## Current M11 / evaluation checkpoint\n\nM11 evidence commits `45581ae7d0f844f67797c590c3ed529390b76f1f`, `ef35d28aca6a044019896e3ecf6c4d4b52113d6f` and `7c5a4634da26b99ee5b74f824f98fe5dcce4dc5b` establish 2/4/8/16-step damage-residual ensemble evaluation, uncertainty calibration, and a strict 64/16/20 fallback-selector test. Mean HP/force drift improves, but long-horizon invalid-action drift remains above generic and both naive disagreement fallback and the calibrated selector are rejected for production. M11 stays PARTIAL / EXPERIMENTAL.\n\nPlanner replay gate commit `cde38a5a89684ff2691c80eeb3583195ffa31758` permanently checks 120 safe held-out states across 109 battles in Linux CI and records 0 invalid recommendations. Replay acceptance is closed; the real authenticated active-battle smoke in `docs/LIVE_VALIDATION.md` remains mandatory before the live product loop is declared complete.\n'''
          if '## Current M11 / evaluation checkpoint' not in t:p.write_text(t.rstrip()+s+'\n',encoding='utf-8')
          p=Path('TEST_REPORT.md');t=p.read_text(encoding='utf-8')
          s='''\n\n## Current M11 uncertainty / selector and 120-state planner gate\n\n- M11 uncertainty calibration (`ef35d28aca6a044019896e3ecf6c4d4b52113d6f`): full-corpus run `31385464567` and standard CI `31385464568` PASS; disagreement predicts absolute error but not learned-vs-generic underperformance, so runtime uncertainty fallback remains disabled.\n- M11 strict selector (`7c5a4634da26b99ee5b74f824f98fe5dcce4dc5b`): diagnostic `31386006048` and standard CI `31386005987` PASS; final 64/16/20 test rejects selector enablement because multi-step L1 is slightly worse than pure ensemble and invalid-action rate remains above generic.\n- Planner replay validity (`cde38a5a89684ff2691c80eeb3583195ffa31758`): diagnostic `31387183686`, stress `31386809158`, and permanent-CI run `31387423155` PASS. Permanent gate covers 120 safe held-out states from 109 battles with 0 invalid recommendations/hash mismatches/illegal root actions/non-finite metrics.\n'''
          if '## Current M11 uncertainty / selector and 120-state planner gate' not in t:p.write_text(t.rstrip()+s+'\n',encoding='utf-8')
          PY
          rm .github/workflows/main_status_sync_aug10.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SPEC.md HeroesWM_Solver_TZ_Status_0.3.0.md docs/MAIN_FRONT_STATUS.md TEST_REPORT.md .github/workflows/main_status_sync_aug10.yml
          git commit -m "docs: synchronize M11 and replay evaluation status"
          git push origin HEAD:main
