name: Inspect Crippling Wound hero context

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh_crippling_hero_context.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy scikit-learn
      - name: Refresh context report
        env:
          PYTHONPATH: python
        run: |
          python -m hwm_solver.evaluation.proc_context_report hwm_battles cripplingwound wnd \
            --types MELEE_ATTACK,RANGED_ATTACK \
            --out data/reports/cripplingwound_proc_context.json
      - name: Commit report and log
        env:
          TOOL_SHA: 65538f5a3cb09904107526a7faa8343cefb59315
        run: |
          rm .github/workflows/refresh_crippling_hero_context.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data: inspect Crippling Wound hero context'
          REPORT_SHA=$(git rev-parse HEAD)
          export REPORT_SHA STAGING_SHA="$GITHUB_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('data/reports/cripplingwound_proc_context.json').read_text(encoding='utf-8'))
          tr=r['train_hero_context'][:8]; te=r['heldout_hero_context'][:8]
          p=Path('changelog.md'); text=p.read_text(encoding='utf-8').rstrip()+'\n\n'
          text += f'''### Crippling Wound hero-context inspection\n\n- Commit: `{os.environ['TOOL_SHA']}`\n  - Extended the reusable proc-context evaluator with same-owner hero creature/tag buckets from canonical `state_before`.\n- Commit: `{os.environ['STAGING_SHA']}`\n  - Staged a self-removing full-corpus refresh for the new hero-context output.\n- Commit: `{os.environ['REPORT_SHA']}`\n  - Refreshed `data/reports/cripplingwound_proc_context.json`.\n  - Largest train hero-context buckets: `{tr}`.\n  - Largest held-out hero-context buckets: `{te}`.\n  - This report is diagnostic only and does not enable a production proc probability.\n'''
          p.write_text(text,encoding='utf-8')
          PY
          git add changelog.md
          git commit -m 'docs: log Crippling Wound hero context'
          git push origin HEAD:main
