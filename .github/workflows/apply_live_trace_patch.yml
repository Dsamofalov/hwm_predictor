name: Apply live closed-loop trace patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_live_trace_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Apply, verify, commit and log live trace
        run: python .github/scripts/apply_live_trace_patch.py
