name: Apply verified Mana Feed patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_manafeed_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Python package
        run: python -m pip install -e '.[dev]'

      - name: Apply, verify, commit and log Mana Feed
        run: python .github/scripts/apply_manafeed_patch.py
