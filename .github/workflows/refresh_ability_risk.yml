name: Refresh current ability risk

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh_ability_risk.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install minimal dependency
        run: python -m pip install numpy

      - name: Recompute held-out ability risk
        env:
          PYTHONPATH: python
        run: |
          python -m hwm_solver.evaluation.ability_risk_report hwm_battles \
            --registry data/catalog/ability_registry.json \
            --out data/reports/ability-risk-current.json

      - name: Commit report and changelog
        run: |
          rm .github/workflows/refresh_ability_risk.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data: refresh current ability risk report'
          REPORT_SHA=$(git rev-parse HEAD)
          export REPORT_SHA STAGING_SHA="$GITHUB_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('data/reports/ability-risk-current.json').read_text(encoding='utf-8'))
          top=r.get('top_contributors',[])[:10]
          summary=', '.join(f"{x['code']}({x['support']},{x['state_occurrences']})" for x in top)
          p=Path('changelog.md')
          text=p.read_text(encoding='utf-8').rstrip()+'\n\n'
          text += f'''### Current ability-risk refresh\n\n- Commit: `{os.environ['STAGING_SHA']}`\n  - Staged a one-shot self-removing risk refresh against the current Ability Registry.\n- Commit: `{os.environ['REPORT_SHA']}`\n  - Recomputed held-out ability risk from the 866-battle corpus using current registry support/risk weights after Life Drain, Regeneration and Mana Feed.\n  - Risk mean / p90: **{r['risk_mean']:.4f} / {r['risk_p90']:.4f}** across **{r['sampled_player_states']}** sampled player states.\n  - Current top contributors: {summary}.\n  - Stored reproducible report at `data/reports/ability-risk-current.json`.\n'''
          p.write_text(text,encoding='utf-8')
          PY
          git add changelog.md
          git commit -m 'docs: log current ability risk refresh'
          git push origin HEAD:main
