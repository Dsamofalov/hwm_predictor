name: Apply verified Life Drain patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_lifedrain_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Apply, verify, commit and log Life Drain
        env:
          PATCH_SCRIPT_COMMIT: 73e7cdd743fdf3606b62c5bfddd5aa1316334c31
        run: python .github/scripts/apply_lifedrain_patch_v2.py
