name: Analyze Paw Strike proc by charge distance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze_pawstrike_proc.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Derive observed proc signature and charge-distance rates
        env:
          PYTHONPATH: python
        run: |
          python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path
          from hwm_solver.protocol.replay import (
              parse_initial_entities, parse_turns, iter_compact_decisions,
              parse_commands, _perspective_owner, _player_won,
          )

          root=Path('hwm_battles/battles')
          by_distance=defaultdict(lambda:[0,0])
          rows=[]
          overlaps=Counter(); forced_total=forced_primary=forced_plus_i=0
          for d in sorted((p for p in root.iterdir() if p.is_dir()),key=lambda p:int(p.name)):
              init=(d/'init.txt').read_text(errors='replace'); turns=(d/'turns0.txt').read_text(errors='replace')
              es,_=parse_initial_entities(init); owner=_perspective_owner(es); won=_player_won(init,es,owner)
              for r in iter_compact_decisions(d.name,es,parse_turns(turns),owner,player_won=won):
                  before={int(e['uid']):e for e in r['state_before']}
                  actor=before.get(int(r['actor_uid'])); target=before.get(int(r['target_uid'])) if r.get('target_uid') is not None else None
                  if not actor or not target or 'pawstrike' not in set(actor.get('abilities') or []) or r['action_type']!='MELEE_ATTACK':
                      continue
                  cmds=parse_commands(r['raw'])
                  damages=[c for c in cmds if c.opcode=='DAMAGE' and c.actor_uid==int(r['actor_uid']) and c.target_uid is not None]
                  if not damages: continue
                  primary=int(damages[0].target_uid)
                  forced=[c for c in cmds if c.opcode=='FORCED_POSITION']
                  i_records=[c for c in cmds if c.opcode=='I_RECORD']
                  forced_total += int(bool(forced))
                  primary_forced=[c for c in forced if int(c.actor_uid or -1)==primary]
                  forced_primary += int(bool(primary_forced))
                  i_for_primary=any(int(c.actor_uid or -1)==primary for c in i_records)
                  proc=bool(primary_forced and i_for_primary)
                  forced_plus_i += int(proc)

                  # Destination chosen for the attacker before damage; if no explicit move,
                  # attack starts from its observed anchor. Chebyshev distance matches board BFS
                  # distance for an unobstructed charge and is the exact observable requested by
                  # the reference description for this empirical probability table.
                  dx=r.get('first_move_x'); dy=r.get('first_move_y')
                  if dx is None or dy is None:
                      move=next((c for c in cmds if c.opcode=='MOVE' and c.actor_uid==int(r['actor_uid'])),None)
                      dx=move.x if move else actor.get('x'); dy=move.y if move else actor.get('y')
                  dist=max(abs(int(dx)-int(actor.get('x',dx))),abs(int(dy)-int(actor.get('y',dy))))
                  by_distance[dist][0]+=1;by_distance[dist][1]+=int(proc)
                  abil=sorted(set(actor.get('abilities') or []))
                  for other in ('powerstrike','mightyslam','bash','shieldbash','knockback'):
                      if other in abil: overlaps[other]+=1
                  rows.append({
                      'battle_id':d.name,'decision_index':r['decision_index'],'actor_uid':r['actor_uid'],
                      'actor_creature_id':actor.get('creature_id'),'actor_abilities':abil,
                      'target_uid':primary,'actor_start':[actor.get('x'),actor.get('y')],
                      'attack_anchor':[dx,dy],'charge_distance':dist,'proc':proc,
                      'forced_primary':[{'x':c.x,'y':c.y,'raw':c.raw} for c in primary_forced],
                      'i_for_primary':i_for_primary,'i_records':[c.raw for c in i_records],
                      'raw':r['raw'],
                  })
          table=[]
          for dist,(n,hits) in sorted(by_distance.items()):
              table.append({'distance':dist,'n':n,'hits':hits,'rate':hits/n if n else 0.0})
          payload={'melee_samples':len(rows),'proc_hits':sum(int(r['proc']) for r in rows),'overall_rate':sum(int(r['proc']) for r in rows)/len(rows) if rows else 0.0,
                   'rows_with_any_forced':forced_total,'rows_with_primary_forced':forced_primary,'rows_with_primary_forced_and_i':forced_plus_i,
                   'ability_overlap_counts':dict(overlaps),'by_charge_distance':table,'rows':rows}
          Path('data/reports/pawstrike_proc_distance.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in payload.items() if k!='rows'},ensure_ascii=False,indent=2))
          PY
      - name: Commit evidence and changelog
        run: |
          rm .github/workflows/analyze_pawstrike_proc.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data: derive Paw Strike proc by charge distance'
          REPORT_SHA=$(git rev-parse HEAD)
          export REPORT_SHA STAGING_SHA="$GITHUB_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('data/reports/pawstrike_proc_distance.json').read_text(encoding='utf-8'))
          p=Path('changelog.md');text=p.read_text(encoding='utf-8').rstrip()+'\n\n'
          text += f'''### Paw Strike proc/charge-distance analysis\n\n- Commit: `{os.environ['STAGING_SHA']}`\n  - Staged a self-removing full-corpus derivation of the Paw Strike observable proc signature: primary target `FORCED_POSITION` plus target `I_RECORD`.\n- Commit: `{os.environ['REPORT_SHA']}`\n  - Stored `data/reports/pawstrike_proc_distance.json`.\n  - Eligible melee samples: **{r['melee_samples']}**; proc hits: **{r['proc_hits']}** ({r['overall_rate']:.4f}).\n  - Any forced-position / primary forced / primary forced+I: **{r['rows_with_any_forced']} / {r['rows_with_primary_forced']} / {r['rows_with_primary_forced_and_i']}**.\n  - Carrier overlap with other knockback abilities: `{r['ability_overlap_counts']}`.\n  - Empirical rate by charge distance: `{r['by_charge_distance']}`.\n'''
          p.write_text(text,encoding='utf-8')
          PY
          git add changelog.md
          git commit -m 'docs: log Paw Strike charge-distance analysis'
          git push origin HEAD:main
