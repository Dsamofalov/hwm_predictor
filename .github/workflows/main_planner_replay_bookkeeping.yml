name: One-shot planner replay gate bookkeeping

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write

jobs:
  bookkeep:
    if: github.repository == 'Dsamofalov/hwm_predictor' && github.event.pull_request.number == 2 && github.event.pull_request.head.ref == 'verify-m13-reroot' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify functional planner replay commit
        run: git merge-base --is-ancestor cde38a5a89684ff2691c80eeb3583195ffa31758 HEAD
      - name: Append changelog and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('changelog.md');t=p.read_text(encoding='utf-8')
          sha='cde38a5a89684ff2691c80eeb3583195ffa31758'
          if sha not in t:
              t=t.rstrip()+'''\n\n### Held-out 120-state planner recommendation validity gate\n\n- Commit: `cde38a5a89684ff2691c80eeb3583195ffa31758`\n  - Strengthened `planner-eval` from the historical first-N/status-only probe to a deterministic stratified sample across all chronological held-out safe states.\n  - Recommendation validity now checks exact canonical `state_hash`, legal best action, legal alternatives, finite score/P(win)/uncertainty, visited candidates, positive simulations and search nodes.\n  - Added permanent `scripts/test_planner_replay_gate.py` and wired a **120-state** held-out gate into standard Linux CI.\n  - Permanent CI budget `1 -> 120` passes **120/120** recommendations sampled from **109** held-out battles with **0** invalid recommendations, hash mismatches, illegal best actions, illegal alternatives or non-finite metrics.\n  - A stronger `80 -> 300` stress reference also passes **120/120**, with action-type stability **98.33%** and exact-action stability **85%**.\n  - Stored `data/reports/planner-replay-validity-gate.json`. Diagnostic runs `31387183686` (permanent budget) and `31386809158` (stress) passed; standard CI run `31387423155` passed on Linux and Windows/MSVC with the permanent gate enabled.\n  - This closes the replay half of the >=100-state invalid-recommendation acceptance gate; real authenticated active-battle smoke remains separately required.\n'''+'\n'
          p.write_text(t,encoding='utf-8')
          PY
          rm .github/workflows/main_planner_replay_bookkeeping.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog.md .github/workflows/main_planner_replay_bookkeeping.yml
          git commit -m "docs: record planner replay validity gate"
          git push origin HEAD:main
