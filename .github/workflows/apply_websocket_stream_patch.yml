name: Apply local websocket streaming patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_websocket_stream_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Apply, verify, commit and log websocket streaming
        # v2 checks numeric 401 semantics and emits warning-clean C++ helpers.
        run: python .github/scripts/apply_websocket_stream_patch_v2.py
