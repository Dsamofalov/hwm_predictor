name: One-shot M13 planner finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main_m13_finalize.yml'

permissions:
  contents: write

jobs:
  verify-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify expected functional parent
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "d06217fd4aa531aa0e49cf7c8c2495a5ab0ca5e4"
      - name: Configure and build C++
        run: |
          cmake --preset debug
          cmake --build build/debug --parallel 2
      - name: Run CTest
        run: ctest --test-dir build/debug --output-on-failure
      - name: Run Python tests
        run: python -m pytest python/tests -q
      - name: TypeScript and extension build
        working-directory: extension
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Bookkeep functional SHA and remove runner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('changelog.md')
          text = p.read_text(encoding='utf-8')
          entry = '''\n\n### M13 stochastic chance-outcome correctness and transpositions\n\n- Commit: `d06217fd4aa531aa0e49cf7c8c2495a5ab0ca5e4`\n  - Replaced the historical single `Edge.child` with per-action outcome bindings keyed by canonical `state_hash`, so different sampled damage/proc outcomes cannot share the first outcome's legal-action node.\n  - Added a per-search transposition graph: equal canonical hashes reuse the same search node across actions/outcomes.\n  - Principal variation now follows the most-visited sampled outcome for each selected action instead of an arbitrary first child.\n  - Added a separate main-owned `hwm-planner-tests` CTest target proving: two outcomes -> two nodes/legal-action sets; equal hash -> shared node. `cpp/tests/test_main.cpp` was deliberately untouched because it is owned by the parallel `ability` lane.\n  - One-shot verification passed C++ configure/build/CTest, full Python pytest, TypeScript typecheck and extension build before this bookkeeping commit.\n'''
          if 'd06217fd4aa531aa0e49cf7c8c2495a5ab0ca5e4' not in text:
              p.write_text(text.rstrip() + entry + '\n', encoding='utf-8')
          PY
          rm .github/workflows/main_m13_finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog.md .github/workflows/main_m13_finalize.yml
          git commit -m "docs: record M13 stochastic outcome fix"
          git push origin HEAD:main
      - name: Synchronize active specification and main status
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path
          section = '''\n\n### 2026-08-10 M13 stochastic-search correctness update\n\n- Functional commit `d06217fd4aa531aa0e49cf7c8c2495a5ab0ca5e4` closes the identified single-child stochastic-tree correctness defect.\n- A planner action edge now keeps distinct sampled outcomes by canonical `state_hash`; legal actions are initialized from the matching outcome state, never reused from a different roll.\n- A per-search transposition table shares nodes for equal canonical `state_hash` values.\n- Persistent tree re-root between separately observed revisions is **not yet implemented**; it is the next M13 step after this correctness prerequisite.\n- Real authenticated active-battle smoke validation remains required before M01/M14 can be marked COMPLETE.\n'''
          for name in ('SPEC.md', 'HeroesWM_Solver_TZ_Status_0.3.0.md'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              marker = '### 2026-08-10 M13 stochastic-search correctness update'
              if marker not in text:
                  p.write_text(text.rstrip() + section + '\n', encoding='utf-8')
          p = Path('docs/MAIN_FRONT_STATUS.md')
          text = p.read_text(encoding='utf-8')
          status = '''\n\n## M13 chance-outcome correctness update\n\nFunctional commit: `d06217fd4aa531aa0e49cf7c8c2495a5ab0ca5e4`.\n\nThe stochastic single-child defect described in the previous handoff is fixed: sampled action outcomes are separated by `state_hash`, equal states use a per-search transposition node, and the regression is isolated in `hwm-planner-tests` to avoid the parallel ability-owned test file. Persistent re-root across observed states remains the next M13 task.\n'''
          if '## M13 chance-outcome correctness update' not in text:
              p.write_text(text.rstrip() + status + '\n', encoding='utf-8')
          p = Path('TEST_REPORT.md')
          text = p.read_text(encoding='utf-8')
          test_status = '''\n\n## M13 stochastic-outcome regression\n\nFunctional commit `d06217fd4aa531aa0e49cf7c8c2495a5ab0ca5e4` adds the dedicated `hwm-planner-tests` CTest target. It verifies distinct stochastic hashes keep distinct nodes/legal-action sets and equal hashes reuse one transposition node. One-shot Linux verification passed C++ configure/build/CTest, full Python pytest, TypeScript typecheck and extension build.\n'''
          if '## M13 stochastic-outcome regression' not in text:
              p.write_text(text.rstrip() + test_status + '\n', encoding='utf-8')
          PY
          git add SPEC.md HeroesWM_Solver_TZ_Status_0.3.0.md docs/MAIN_FRONT_STATUS.md TEST_REPORT.md
          git commit -m "docs: synchronize M13 chance-outcome status"
          git push origin HEAD:main
