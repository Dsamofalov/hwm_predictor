name: One-shot M11 multistep bookkeeping

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write

jobs:
  bookkeep:
    if: github.repository == 'Dsamofalov/hwm_predictor' && github.event.pull_request.number == 2 && github.event.pull_request.head.ref == 'verify-m13-reroot' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify functional M11 commit
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 45581ae7d0f844f67797c590c3ed529390b76f1f HEAD
      - name: Append changelog and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('changelog.md')
          t=p.read_text(encoding='utf-8')
          sha='45581ae7d0f844f67797c590c3ed529390b76f1f'
          if sha not in t:
              t=t.rstrip()+'''\n\n### M11 multi-step damage-residual ensemble gate\n\n- Commit: `45581ae7d0f844f67797c590c3ed529390b76f1f`\n  - Added `python/hwm_solver/evaluation/dynamics_multistep.py` and targeted tests for a five-member train-battle jackknife ensemble over the existing primary physical-damage residual.\n  - Added autoregressive held-out evaluation at 2/4/8/16 halfturn horizons. Non-primary mechanics remain teacher-forced so the gate isolates primary physical-damage residual drift rather than attributing proc/collateral/resurrection errors to this submodel.\n  - Predicted-invalid actions are preserved as divergence instead of silently teacher-forcing the observed primary damage after model drift makes the real action impossible.\n  - Stored `data/reports/dynamics-multistep-damage.json` from 692 train / 174 chronological held-out battles and 23,451 train attack samples.\n  - Ensemble mean force-L1 beats the generic exact-formula baseline at every measured horizon: 2-step **0.01137 vs 0.01679**, 4-step **0.01791 vs 0.02728**, 8-step **0.02986 vs 0.04710**, 16-step **0.04947 vs 0.08125**.\n  - Production enablement remains intentionally **false**: at 16 steps the ensemble predicted-invalid-action fraction is **3.58%** vs **2.51%** generic and alive mismatch is **8.83%**. This closes the first M11 submodel multi-step evidence gate, not the full learned world-model requirement.\n  - M11 diagnostic run `31384739406`: **PASS** with targeted tests **5/5**. Full standard CI run `31384739323`: **PASS** on Linux and Windows/MSVC.\n'''+'\n'
          p.write_text(t,encoding='utf-8')
          PY
          rm .github/workflows/main_m11_bookkeeping.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog.md .github/workflows/main_m11_bookkeeping.yml
          git commit -m "docs: record M11 multistep dynamics gate"
          git push origin HEAD:main
