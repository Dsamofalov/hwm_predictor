name: Probe Paw Strike corpus

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe_pawstrike.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Probe Paw Strike and extract registry metadata
        env:
          PYTHONPATH: python
        run: |
          python scripts/ability_probe.py hwm_battles pawstrike --rows 1000 --out data/reports/pawstrike_probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('data/catalog/ability_registry.json').read_text(encoding='utf-8'))
          entry=next(x for x in reg['abilities'] if x.get('code')=='pawstrike')
          Path('data/reports/pawstrike_registry_entry.json').write_text(json.dumps(entry,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(entry,ensure_ascii=False,indent=2))
          PY
      - name: Commit evidence and changelog
        run: |
          rm .github/workflows/probe_pawstrike.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data: capture Paw Strike corpus probe'
          REPORT_SHA=$(git rev-parse HEAD)
          export REPORT_SHA STAGING_SHA="$GITHUB_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path('data/reports/pawstrike_probe.json').read_text(encoding='utf-8'))
          e=json.loads(Path('data/reports/pawstrike_registry_entry.json').read_text(encoding='utf-8'))
          log=Path('changelog.md'); text=log.read_text(encoding='utf-8').rstrip()+'\n\n'
          text += f'''### Paw Strike corpus probe\n\n- Commit: `{os.environ['STAGING_SHA']}`\n  - Staged a self-removing full-corpus probe for `pawstrike` after Mighty Slam became exact.\n- Commit: `{os.environ['REPORT_SHA']}`\n  - Stored `data/reports/pawstrike_probe.json` and `pawstrike_registry_entry.json`.\n  - Reference: **{e.get('name','')}** — {e.get('description','')}\n  - Matched decisions: **{p['matched_decisions']}** across **{p['battles']}** battles; candidates **{p['candidate_decisions']}**; parse errors **{len(p['errors'])}**.\n  - Action types: `{p['action_types']}`; special codes: `{p['special_codes']}`.\n  - Target position deltas: `{p['target_deltas']['position']}`; effect additions: `{p['target_deltas']['effects_added']}`.\n'''
          log.write_text(text,encoding='utf-8')
          PY
          git add changelog.md
          git commit -m 'docs: log Paw Strike corpus probe'
          git push origin HEAD:main
