name: Probe Mana Feed corpus

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe_manafeed.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Run Mana Feed corpus probe
        env:
          PYTHONPATH: python
        run: |
          python scripts/ability_probe.py hwm_battles manafeed \
            --rows 120 \
            --out data/reports/manafeed_probe.json

      - name: Commit report and log it
        env:
          PROBE_TOOL_SHA: 0346b7befb70ac3d47540ed60f4d857016c9ddbe
        run: |
          rm .github/workflows/probe_manafeed.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data: capture Mana Feed corpus probe'
          REPORT_SHA=$(git rev-parse HEAD)
          export REPORT_SHA
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path('data/reports/manafeed_probe.json').read_text(encoding='utf-8'))
          p=Path('changelog.md')
          text=p.read_text(encoding='utf-8').rstrip()+'\n\n'
          text += f'''### Ability decision corpus probe\n\n- Commit: `{os.environ['PROBE_TOOL_SHA']}`\n  - Added `scripts/ability_probe.py`, a read-only analyzer built on the canonical `iter_battle_decisions()` replay stream.\n- Commit: `{os.environ['REPORT_SHA']}`\n  - Ran the probe over the repository `hwm_battles` corpus for `manafeed` and stored `data/reports/manafeed_probe.json`.\n  - Matched decisions: **{report['matched_decisions']}** across **{report['battles']}** battles; mechanic-like candidates: **{report['candidate_decisions']}**.\n  - The report preserves raw decision records/opcodes and already-decoded mana deltas for evidence-driven wire decoding.\n  - Probe parse errors: **{len(report['errors'])}**.\n'''
          p.write_text(text,encoding='utf-8')
          PY
          git add changelog.md
          git commit -m 'docs: log Mana Feed corpus probe'
          git push origin HEAD:main
