name: Cleanup obsolete branches

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup_obsolete_branches.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: [self-hosted, windows, x64, hwm-windows]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Delete obsolete branches, record cleanup, and remove this workflow
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $branches = @(
            'diagnostics',
            'm11-uncertainty-repro',
            'm13-effect-hash',
            'm13-hash-fix',
            'main-windows-full-validation',
            'main-windows-validation-final',
            'verify-m13-reroot'
          )

          foreach ($branch in $branches) {
            git ls-remote --exit-code --heads origin "refs/heads/$branch" *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Deleting obsolete branch: $branch"
              git push origin --delete $branch
              if ($LASTEXITCODE -ne 0) { throw "Failed to delete branch: $branch" }
            } else {
              Write-Host "Already absent: $branch"
            }
          }

          $path = 'changelog.md'
          $marker = '### Windows CI normalization and branch cleanup'
          $existing = Get-Content -Raw -Encoding UTF8 $path
          if (-not $existing.Contains($marker)) {
            $lines = @(
              ''
              $marker
              ''
              '- Commit: `681b7f52d058773276967bad56c9d2163c89cd8a`'
              '  - Centralized Windows runner setup and permanent validation commands in `scripts/ci_windows.ps1`, replacing workflow-embedded bootstrap/test logic.'
              '- Commit: `87b5bf03c2a4ac160ceccadb674416cb9b2d56a6`'
              '  - Added canonical M11 evidence verification as normal Python code rather than embedded workflow scripting.'
              '- Commit: `5f4d8311854d92efce8fcf71b9cc014effac4edd`'
              '  - Added regression coverage that parses GitHub Actions YAML and enforces the Windows-only runner contract.'
              '- Commit: `34fc8c5d2e295a85da26afaa7e76296c2f348d73`'
              '  - Split standard Windows CI into independent permanent `Core` and `Full` jobs. With two matching self-hosted runners the jobs can execute concurrently; with one runner they queue normally.'
              '- Commit: `99cd646bbc5c2a6a2c6d8d0aa90e530e98bc3230`'
              '  - Aligned local `scripts/validate_windows.ps1` with the same Core/Full suites, eliminating duplicated local-vs-CI validation logic.'
              '- Commit: `29bfe624852411d464a5c5d48e129d65dd506bed`'
              '  - Preserved the recommendation-explanation integration contract from the diagnostics branch before cleanup.'
              '- Commits: `5bbfa3e5bd9e6a0f37aa0b7d73c4a3f5b77e87bb`, `767b842a6793f8da071637c6a45c1b21d7730936`'
              '  - Preserved the M11 positive-residual temperature calibration experiment and its unit tests from diagnostics; the unstable hard-PvE sampler was intentionally discarded.'
              '- Commit: `8878d1da44aa74f6ad346afbd9bc81ca5c174665`'
              '  - Added the M11 temperature calibration command to the permanent Windows `Full` suite so future heavy diagnostics do not require temporary branches/workflows.'
              '- Commit: `510b49931c87606522da17f13e3f1cff7b35579b`'
              '  - Bounded OpenMP/MKL/OpenBLAS/NumExpr to two threads per CI job so two self-hosted runners on one Windows PC can run Core and Full concurrently without each numerical process consuming every CPU core.'
              '- Commit: `151d568ee34a6fbf234d063a6c645d1341cebd9a`'
              '  - Removed a redundant bootstrap helper after consolidation on `scripts/ci_windows.ps1`.'
              '- Repository branch cleanup:'
              '  - Keep: `main`, `ability`.'
              '  - Delete as obsolete/fully absorbed: `m11-uncertainty-repro`, `m13-effect-hash`, `m13-hash-fix`, `main-windows-full-validation`, `main-windows-validation-final`, `verify-m13-reroot`.'
              '  - Delete `diagnostics` after preserving its explanation contract and M11 temperature gate; its hard-PvE sampler remains intentionally unintegrated because its battle-diversity design was not production-ready.'
            )
            Add-Content -Path $path -Value (($lines -join [Environment]::NewLine) + [Environment]::NewLine) -Encoding UTF8
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/cleanup_obsolete_branches.yml'
          git add changelog.md
          git commit -m 'docs: record Windows CI normalization and branch cleanup'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to commit branch cleanup bookkeeping.' }

          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Failed to refresh main.' }
          git rebase origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Failed to rebase cleanup commit onto main.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Failed to push completed branch cleanup.' }
