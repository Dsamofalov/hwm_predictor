syntax = "proto3";
package hwm;
enum Side { SIDE_UNKNOWN=0; PLAYER=1; PVE=2; }
enum EntityKind { ENTITY_UNKNOWN=0; STACK=1; HERO=2; OBJECT=3; SUMMON=4; }
enum BattlePhase { PHASE_UNKNOWN=0; DEPLOYMENT=1; COMBAT=2; FINISHED=3; }
message Cell { int32 x=1; int32 y=2; }
message Effect { uint32 id=1; int32 duration=2; float magnitude=3; string raw=4; }
message Counter { uint32 id=1; int32 value=2; }
message Entity {
  uint64 uid=1; uint32 creature_id=2; Side side=3; EntityKind kind=4;
  Cell anchor=10; repeated Cell footprint=11; bool alive=12;
  int32 count=20; int32 top_unit_hp=21; int32 max_hp_per_unit=22;
  float attack=30; float defense=31; float min_damage=32; float max_damage=33;
  float speed=34; float initiative=35; int32 shots=36; int32 mana=37;
  repeated uint32 ability_ids=40; repeated Effect effects=41; repeated Counter counters=42;
  bool retaliation_available=50; bool waited_this_round=51;
}
message Board { uint32 width=1; uint32 height=2; repeated Cell blocked=3; }
message InitiativeState { repeated uint64 queue=1; repeated float atb=2; }
message RandomContext { uint64 seed_hint=1; repeated string observations=2; }
message SourceMetadata { string source=1; string raw_hash=2; string url=3; }
message BattleState {
  string battle_id=1; uint64 state_seq=2; uint32 protocol_version=3; uint32 ruleset_version=4;
  Board board=10; repeated Entity entities=11; InitiativeState initiative=13; repeated Effect global_effects=14;
  uint64 active_entity_uid=20; Side side_to_act=21; BattlePhase phase=22; uint32 round=23; uint32 halfturn=24;
  RandomContext random_context=31; SourceMetadata source=40;
}
